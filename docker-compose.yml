version: '3.8'

services:
  # ==========================================
  # Database Service (MongoDB Core)
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: athena_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # ==========================================
  # Backend Flask REST Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athena_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ai_research_db
      - FLASK_ENV=production
      - SECRET_KEY=replace-with-a-very-long-random-string-in-prod
      - JWT_SECRET_KEY=replace-with-another-secure-jwt-key-in-prod
      - GEMINI_API_KEY=your_gemini_api_key
      - CLOUDINARY_CLOUD_NAME=your_cloud_name
      - CLOUDINARY_API_KEY=your_api_key
      - CLOUDINARY_API_SECRET=your_api_secret
    depends_on:
      - mongodb

  # ==========================================
  # Frontend React Web Client
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athena_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
