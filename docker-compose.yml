version: '3.8'

services:
  # ==========================================
  # Database Service (MongoDB Core)
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: athena_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - athena_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Backend Flask REST Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athena_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/ai_research_db}
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-replace-with-a-very-long-random-string-in-prod}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-replace-with-another-secure-jwt-key-in-prod}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - PORT=5000
      - HOST=0.0.0.0
    networks:
      - athena_network
    depends_on:
      mongodb:
        condition: service_healthy

  # ==========================================
  # Frontend React Web Client
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athena_frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - athena_network
    depends_on:
      - backend

networks:
  athena_network:
    driver: bridge

volumes:
  mongodb_data:

